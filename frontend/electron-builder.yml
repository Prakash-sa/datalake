appId: com.datalake.ragqueryengine
productName: RAG Query Engine
asar: true

# Disables RunAsNode, NODE_OPTIONS, and inspect arguments in the packaged
# binary. Runs before signing so the flipped bits are covered by the signature.
afterPack: ./scripts/apply-fuses.js
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

files:
  - electron/**/*
  - out/**/*
  - public/**/*
  - package.json
  - next.config.js

extraResources:
  - from: ../backend/dist
    to: backend
    filter:
      - "**/*"

directories:
  output: dist
  buildResources: build

compression: maximum

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  category: Development
  target:
    - AppImage
    - deb

publish:
  provider: github
  releaseType: draft
