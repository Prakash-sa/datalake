version: "3.8"

services:
  # Ollama for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag-network

  # RAG Backend (Python/FastAPI)
  rag-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      TRINO_HOST: trino
      TRINO_PORT: 8080
      OLLAMA_API_BASE: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./backend:/app
      - ./chroma_db:/app/chroma_db
    networks:
      - rag-network
    command: python main.py

  # Frontend (Next.js)
  rag-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "3000:3000"
    depends_on:
      - rag-backend
    networks:
      - rag-network
    environment:
      NEXT_PUBLIC_API_URL: http://rag-backend:8000

volumes:
  ollama_data:

networks:
  rag-network:
    driver: bridge
