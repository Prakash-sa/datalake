name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=rag_backend --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build static export
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches merge errors and bad interpolation without building images.
      - name: Validate merged compose configurations
        run: |
          cp compose/.env.example compose/.env
          docker compose -f compose/compose.yml -f compose/compose.dev.yml config -q
          docker compose -f compose/compose.yml -f compose/compose.airflow.yml config -q
          ALLOWED_ORIGINS=http://localhost:3000 \
          NEXT_PUBLIC_API_URL=http://localhost:8000 \
          MINIO_ROOT_USER=ci MINIO_ROOT_PASSWORD=ci-secret \
            docker compose -f compose/compose.yml -f compose/compose.prod.yml config -q
