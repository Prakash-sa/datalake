name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "rag-desktop-v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest
          - ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: python -m pip install "../backend[packaging,local-generation]"
      - name: Fetch the bundled embedding model
        # Shipped in the installer so a fresh machine can index and search with
        # no external software present.
        run: python ../backend/scripts/fetch_embedding_model.py
      - name: Fetch the bundled generation model
        # URL, checksum, and licence review are release inputs because model
        # publishers can change weights/licences independently of this repo.
        run: python ../backend/scripts/fetch_generation_model.py
        env:
          LOCAL_LLM_GGUF_URL: ${{ secrets.LOCAL_LLM_GGUF_URL }}
          LOCAL_LLM_GGUF_SHA256: ${{ secrets.LOCAL_LLM_GGUF_SHA256 }}
          ALLOW_MISSING_LOCAL_LLM: "1"
      - name: Report signing mode
        if: matrix.os != 'ubuntu-24.04'
        shell: bash
        run: |
          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "::warning::No code-signing certificate configured; this build will be unsigned."
            echo "::warning::macOS Gatekeeper and Windows SmartScreen may require manual user bypass."
            exit 0
          fi

          if [ "${{ matrix.os }}" = "macos-14" ]; then
            if [ -z "${APPLE_API_KEY:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ]; then
              echo "::warning::macOS signing is configured, but notarization secrets are missing."
              echo "::warning::The macOS artifact may still require Gatekeeper manual approval."
              exit 0
            fi
          fi

          echo "Signing inputs are configured for this platform."
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ALLOW_MISSING_LOCAL_LLM: "1"
      - name: Build desktop package
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: frontend/dist
          format: spdx-json
          output-file: frontend/dist/sbom.spdx.json
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          find . -type f ! -name "SHA256SUMS" -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rag-query-engine-${{ matrix.os }}
          path: frontend/dist/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/rag-desktop-v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Desktop builds

          These artifacts are attached for early testers. If signing secrets were
          not configured for this run, macOS and Windows builds are unsigned.

          Unsigned build behavior:

          - macOS may show that the developer cannot be verified. Use System
            Settings -> Privacy & Security -> Open Anyway if you trust the build.
          - Windows may show Unknown publisher / Windows protected your PC. Use
            More info -> Run anyway if you trust the build.
          - If this run did not include `LOCAL_LLM_GGUF_URL` and
            `LOCAL_LLM_GGUF_SHA256`, written answers require adding a local GGUF
            model in Settings or switching generation to Ollama. Import and
            search still work.

          Verify downloaded files with the attached `SHA256SUMS` files.
          EOF
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-artifacts/**
