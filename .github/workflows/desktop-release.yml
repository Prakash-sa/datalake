name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "rag-desktop-v*"

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest
          - ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: python -m pip install "../backend[packaging,local-generation]"
      - name: Fetch the bundled embedding model
        # Shipped in the installer so a fresh machine can index and search with
        # no external software present.
        run: python ../backend/scripts/fetch_embedding_model.py
      - name: Fetch the bundled generation model
        # URL, checksum, and licence review are release inputs because model
        # publishers can change weights/licences independently of this repo.
        run: python ../backend/scripts/fetch_generation_model.py
        env:
          LOCAL_LLM_GGUF_URL: ${{ secrets.LOCAL_LLM_GGUF_URL }}
          LOCAL_LLM_GGUF_SHA256: ${{ secrets.LOCAL_LLM_GGUF_SHA256 }}
      - name: Validate signing and notarization secrets
        if: startsWith(github.ref, 'refs/tags/rag-desktop-v') && matrix.os != 'ubuntu-24.04'
        shell: bash
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for signed desktop releases"
              missing=1
            fi
          done
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is required for macOS notarization"
                missing=1
              fi
            done
          fi
          exit "$missing"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Build desktop package
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: frontend/dist
          format: spdx-json
          output-file: frontend/dist/sbom.spdx.json
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          find . -type f ! -name "SHA256SUMS" -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rag-query-engine-${{ matrix.os }}
          path: frontend/dist/**
          if-no-files-found: error
