[project]
name = "rag-query-engine-backend"
version = "0.1.0"
description = "Local-first document RAG backend sidecar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.104.1",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.1.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.6",
  "langchain>=0.1.0",
  "langchain-ollama>=0.1.0",
  "langchain-core>=0.2.0",
  "httpx>=0.25.2",
  "minio>=7.2.0",
  "chromadb>=0.4.0",
  "PyMuPDF>=1.24.0",
  "python-docx>=1.1.0",
  "gunicorn>=21.2.0",
  "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.3",
  "pytest-asyncio>=0.21.1",
  "ruff>=0.1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
