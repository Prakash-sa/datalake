# Supporting services for the Airflow ingestion pipeline.
#
# The desktop application does not use any of this: it runs the backend as a
# packaged sidecar and embeds in-process. These services exist for the
# server-side pipeline that loads documents in bulk from object storage.
#
#   docker compose -f compose/compose.yml -f compose/compose.airflow.yml up
#
# `make up-airflow` wraps that. Paths are relative to this file.

name: rag-pipeline

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ../volumes/ollama_data:/root/.ollama
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ../volumes/minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chroma
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    environment:
      CHROMA_HOST: 0.0.0.0
      CHROMA_PORT: 8000
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - ../volumes/chroma_data:/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  rag-network:
    driver: bridge
