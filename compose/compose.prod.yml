# Production overlay: hardened images, restart policies, and resource limits.
#
#   docker compose -f compose/compose.yml -f compose/compose.prod.yml up -d
#
# Only the differences from the base stack live here; everything else is
# inherited. Set the referenced variables in compose/.env before deploying.

services:
  ollama:
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-8}
    restart: unless-stopped

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    restart: unless-stopped

  chroma:
    restart: unless-stopped

  rag-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    environment:
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: ${WORKERS:-4}
      APP_DATA_DIR: /data
      CHROMA_PATH: /data/chroma_db
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      LLM_MODEL: ${LLM_MODEL:-mistral}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
    volumes:
      # No source mount in production; the image is self-contained.
      - ../volumes/backend_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-4G}
        reservations:
          cpus: "${CPU_RESERVE:-1}"
          memory: ${MEMORY_RESERVE:-2G}

  rag-frontend:
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    restart: unless-stopped
